app-id: com.howlingmoonsoftware.CrayonBall
runtime: org.freedesktop.Platform
runtime-version: '22.08'
sdk: org.freedesktop.Sdk
command: crayonball

finish-args:
  - --device=dri
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio

modules:
  - shared-modules/SDL2/SDL2-with-libdecor.json
  - shared-modules/glu/glu-9.json
  - name: openal-soft
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://openal-soft.org/openal-releases/openal-soft-1.25.0.tar.bz2
        sha256: f671087c9043b1e92cd0b125af6f43663249d3c02bc6d580d774a47a91050e0e
        x-checker-data:
          type: anitya
          stable-only: true
          project-id: 8172
          url-template: https://openal-soft.org/openal-releases/openal-soft-$version.tar.bz2
    cleanup:
      - /bin
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share
  - name: Ruby
    sources:
      - type: archive
        url: https://cache.ruby-lang.org/pub/ruby/1.8/ruby-1.8.7.tar.gz
        sha256: 600dccf13bca3e4179fa6ff554220ce4ba67ffc72bce1ac3bf74c2599c03a0ca
      - type: shell
        commands:
          - rm -rf ext/openssl
          - cp -p /usr/share/automake-*/config.{sub,guess} .
    cleanup:
      - /bin
      - /lib/*.a
      - /lib/ruby
      - /share
  - name: CrayonBall
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/slembcke/CrayonBall.git
        tag: v2.3.3
        commit: c726ca71e3bfce440409673fcf4af0bd483f4a7f
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: patch
        path: crayonball-ruby.patch
    cleanup:
      - /lib
