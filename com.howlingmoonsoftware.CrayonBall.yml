app-id: com.howlingmoonsoftware.CrayonBall
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: crayonball

finish-args:
  - --device=dri
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
modules:
  - shared-modules/glu/glu-9.json

  - name: Ruby
    build-options:
      cflags: -Wno-error=incompatible-pointer-types -Wno-error=implicit-int -std=gnu17
    cleanup:
      - "*"
    sources:
      - type: archive
        url: https://cache.ruby-lang.org/pub/ruby/1.8/ruby-1.8.7.tar.gz
        sha256: 600dccf13bca3e4179fa6ff554220ce4ba67ffc72bce1ac3bf74c2599c03a0ca
      - type: shell
        commands:
          - rm -rf ext/openssl
          - cp -p /usr/share/automake-*/config.{sub,guess} .

  - name: CrayonBall
    buildsystem: meson
    build-options:
      cflags: -Wno-error=incompatible-pointer-types
    cleanup:
      - /lib
    sources:
      - type: git
        url: https://github.com/slembcke/CrayonBall.git
        tag: v2.3.3
        commit: c726ca71e3bfce440409673fcf4af0bd483f4a7f
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: patch
        paths:
          - fix-appdata.patch
          - crayonball-ruby.patch
