app-id: com.howlingmoonsoftware.CrayonBall
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: crayonball

finish-args:
  - --device=dri
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - '*.la'
  - '*.a'
modules:
  - shared-modules/glu/glu-9.json

  - name: openal-soft
    buildsystem: cmake-ninja
    cleanup:
      - /bin
      - /lib/ruby
      - /share
    sources:
      - type: archive
        url: https://openal-soft.org/openal-releases/openal-soft-1.25.2.tar.bz2
        sha256: 1dbaac44e7579d5bc8847ca8db4b2e8b9fd3961041f35ee20def4958301e1089
        x-checker-data:
          type: anitya
          stable-only: true
          project-id: 8172
          url-template: https://openal-soft.org/openal-releases/openal-soft-$version.tar.bz2

  - name: Ruby
    build-options:
      cflags: -Wno-error=incompatible-pointer-types -Wno-error=implicit-int
    cleanup:
      - /bin
      - /lib/ruby
      - /share
    sources:
      - type: archive
        url: https://cache.ruby-lang.org/pub/ruby/1.8/ruby-1.8.7.tar.gz
        sha256: 600dccf13bca3e4179fa6ff554220ce4ba67ffc72bce1ac3bf74c2599c03a0ca
      - type: shell
        commands:
          - rm -rf ext/openssl
          - cp -p /usr/share/automake-*/config.{sub,guess} .

  - name: CrayonBall
    buildsystem: meson
    cleanup:
      - /lib
    sources:
      - type: git
        url: https://github.com/slembcke/CrayonBall.git
        tag: v2.3.3
        commit: c726ca71e3bfce440409673fcf4af0bd483f4a7f
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: patch
        paths:
          - fix-appdata.patch
          - crayonball-ruby.patch
